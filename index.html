<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Birthday Trip Poll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#0a0a0a; --panel:#141414; --panel2:#1b1b1b; --line:#2b2b2b; --line2:#3a3a3a;
    --ink:#f4f1ea; --muted:#9b958a; --gold:#f2b632; --red:#ff3b3b; --emerald:#1fd1a0;
    --display:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;color:var(--ink);min-height:100vh;
    font:16px/1.5 "Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(ellipse at 50% -8%, rgba(242,182,50,.16), transparent 55%),
      repeating-linear-gradient(135deg, transparent 0 16px, rgba(255,255,255,.018) 16px 17px),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:620px;margin:0 auto;padding:0 16px 70px}

  .ticker{margin:0 -16px;border-bottom:1px solid var(--gold);background:#000;overflow:hidden;white-space:nowrap}
  .ticker .track{display:inline-block;padding:9px 0;animation:slide 26s linear infinite;font:700 11.5px/1 "Inter",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .ticker .track span{margin:0 18px}
  .ticker .track b{color:#5a5a5a;font-weight:700}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion: reduce){ .ticker .track{animation:none} }

  header{padding:34px 4px 18px}
  .eyebrow{display:flex;align-items:center;gap:12px;font-weight:800;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .eyebrow:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
  h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:42px;line-height:1.02;margin:14px 0 12px;letter-spacing:.012em}
  .sub{color:var(--muted);margin:0;max-width:470px;font-weight:500}

  .seg{display:flex;gap:5px;margin:22px 0 10px}
  .seg i{flex:1;height:4px;background:var(--line);border-radius:1px;transition:background .2s}
  .seg i.on{background:var(--gold)}
  .count{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
  .count b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.06em;color:var(--gold)}

  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:22px 18px 20px}
  h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:27px;line-height:1.1;margin:0 0 6px;letter-spacing:.02em}
  .hint{color:var(--muted);font-size:14.5px;font-weight:500;margin:0 0 8px}

  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0 0;font:inherit;cursor:pointer;transition:border-color .12s, background .12s, transform .1s}
  .opt:hover{border-color:var(--gold);transform:translateX(2px)}
  .opt .bd{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:4px;font-family:var(--display);font-size:17px;letter-spacing:.04em;color:var(--muted)}
  .opt .tx{flex:1}
  .opt b{display:block;font-weight:700}
  .opt .d{display:block;color:var(--muted);font-size:14px;font-weight:500;margin-top:1px}
  .opt.sel{border-color:var(--gold);background:#1f1a0d}
  .opt.sel .bd{background:var(--gold);border-color:var(--gold);color:#0a0a0a}

  .nav{display:flex;gap:12px;margin-top:20px}
  button.btn{flex:1;border:1px solid var(--line2);border-radius:6px;padding:15px;font:800 14px/1 "Inter",sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;color:var(--ink);background:transparent;transition:background .12s, transform .08s}
  button.btn:hover{background:#1b1b1b}
  button.btn:active{transform:translateY(1px)}
  .primary{background:var(--gold)!important;border-color:var(--gold)!important;color:#0a0a0a!important}
  .primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.35;cursor:not-allowed;filter:none}

  .match{--tc:var(--gold);border:1px solid var(--tc);border-radius:6px;padding:22px 18px;background:linear-gradient(165deg,var(--tt,#1d180a),#101010 70%);position:relative;overflow:hidden}
  .match:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
  .tag{display:inline-block;border:1px solid var(--tc);color:var(--tc);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;padding:5px 10px;border-radius:3px}
  .match .mono{font-family:var(--display);font-size:76px;line-height:.95;color:var(--tc);margin:14px 0 4px;letter-spacing:.01em}
  .match h2{font-size:30px;margin:0}
  .match .tagline{color:var(--tc);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;margin:4px 0 0}
  .meta{color:#c8c2b6;font-size:14.5px;margin:12px 0 0;font-weight:600}
  .match p{margin:12px 0 0;color:var(--ink);font-weight:500}
  .match p.meta{color:var(--muted);font-weight:600}

  .bars{margin:22px 2px 6px}
  .bar{margin:14px 0}
  .bar .row{display:flex;justify-content:space-between;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
  .bar .row span:last-child{color:var(--muted)}
  .bar .tr{height:10px;background:#1f1f1f;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .bar .fill{height:100%;transition:width .55s ease}

  .trip{display:block;border:1px solid var(--line);border-radius:6px;padding:13px 14px;margin:10px 0;cursor:pointer;background:var(--panel2);transition:border-color .12s}
  .trip:hover{border-color:var(--line2)}
  .trip.sel{border-color:var(--tc);background:var(--tt)}
  .trip .t{display:flex;gap:12px;align-items:center;font-weight:700}
  .trip .t input{accent-color:var(--gold);width:18px;height:18px;flex:0 0 auto}
  .trip .t .mn{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--tc);min-width:64px}
  .trip .d{color:var(--muted);font-size:13.5px;font-weight:500;margin:5px 0 0 0}

  label.f{display:block;font-weight:800;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;margin:22px 0 8px;color:var(--gold)}
  input[type=text],textarea{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:13px;font:inherit;font-weight:500}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--gold)}
  input::placeholder,textarea::placeholder{color:#6b665d}
  textarea{min-height:84px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:1px solid var(--line2);border-radius:4px;padding:10px 14px;cursor:pointer;font:700 14px/1 "Inter",sans-serif;background:var(--panel2);color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.sel{border-color:var(--gold);background:var(--gold);color:#0a0a0a}
  .note{color:var(--muted);font-size:14px;font-weight:500;margin:14px 0 0}
  pre{white-space:pre-wrap;background:#0d0d0d;border:1px dashed var(--line2);border-radius:6px;padding:14px;font:500 14px/1.55 "Inter",sans-serif;margin:12px 0;color:var(--ink)}
  .ok{color:var(--emerald);font-weight:800;margin:0;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
  .hidden{display:none}
  .foot{text-align:center;color:#6b665d;font-weight:700;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="ticker" aria-hidden="true"><div class="track" id="track"></div></div>

  <header>
    <div class="eyebrow" id="eyebrow">Feb 2027 guys trip</div>
    <h1 id="title">Where are we celebrating?</h1>
    <p class="sub" id="intro">I'm turning another year older, and the only fitting response is a trip. Vegas or Mexico City. Answer nine questions and see which city has your name on it. You still get the final call.</p>
  </header>

  <div id="quiz">
    <div class="seg" id="seg"></div>
    <div class="count"><span id="count"></span><b id="num"></b></div>
    <div class="card" id="card"></div>
    <div class="nav">
      <button class="btn" id="back">Back</button>
      <button class="btn primary" id="next" disabled>Next</button>
    </div>
  </div>

  <div id="result" class="hidden"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ============ EDIT THESE ============ */
const CONFIG = {
  organizer: "Andrew",
  replyBy: "",              // e.g. "Nov 20"  (shown to guys; leave blank to hide)
  formEndpoint: "https://formspree.io/f/meaawpov",         // optional: a Formspree URL like https://formspree.io/f/xxxxxxx
  eyebrow: "Feb 2027 guys trip"
};
/* ==================================== */

const TRIPS = {
  vegas: {
    mono: "LV", color: "#ff3b3b", tint: "#220f0f",
    name: "Las Vegas",
    tagline: "The Birthday Weekend",
    dates: "Fri Feb 19 to Mon Feb 22 (birthday is Fri Feb 19)",
    cost: "Roughly $1,300 to $2,200 per person",
    pitch: "Vegas. Big night out, a hike at Red Rock, a house with a real kitchen, steaks on the birthday. Nonstop from Ohio.",
    catch: "Cool in February (60s) and lighter on culture than Mexico City."
  },
  mexico: {
    mono: "CDMX", color: "#1fd1a0", tint: "#0a201a",
    name: "Mexico City",
    tagline: "The Mexican Experience",
    dates: "Thu Feb 18 to Mon Feb 22",
    cost: "Roughly $1,500 to $2,200 per person",
    pitch: "This city gave me a year of my life and I want to show you why. Great food, great people, great nights: tacos al pastor where locals eat, mezcal bars, murals, the pyramids, and one long birthday dinner. I'll handle the details.",
    catch: "Passport needed, no nonstop from Cincinnati, and no confirmed headline R&B show."
  }
};
const KEYS = ["vegas","mexico"];

const QUESTIONS = [
  { q: "What kind of weekend are we having?", hint: "Pick the one that sounds best.",
    options: [
      { label: "Party and hangout", desc: "Shows, nightlife, staying up late", s: {vegas:3, mexico:2} },
      { label: "Explore and eat", desc: "Neighborhoods, culture, long meals", s: {vegas:0, mexico:3} },
      { label: "Relax and recharge", desc: "Easy pace, good company, no rushing", s: {vegas:2, mexico:1} },
      { label: "A little of everything", desc: "", s: {vegas:1, mexico:1} }
    ]},
  { q: "How much does warm weather matter?", hint: "February highs: Vegas 60s, Mexico City 70s.",
    options: [
      { label: "I want to be warm", desc: "Shorts and sunscreen", s: {vegas:0, mexico:3} },
      { label: "Mild is fine", desc: "Light jacket at night is no problem", s: {vegas:2, mexico:2} },
      { label: "I don't care", desc: "", s: {vegas:1, mexico:1} }
    ]},
  { q: "How should we celebrate the night of the 19th?", hint: "Friday, Feb 19.",
    options: [
      { label: "A big show", desc: "Headliner, then out after", s: {vegas:3, mexico:0} },
      { label: "An unforgettable dinner", desc: "Long table, great food, great stories", s: {vegas:2, mexico:3} },
      { label: "Out with the whole crew", desc: "Clubs, lounges, keep moving", s: {vegas:2, mexico:3} },
      { label: "Low key", desc: "Cook-in, music, good company", s: {vegas:2, mexico:1} }
    ]},
  { q: "What does your ideal night out look like?", hint: "Pick the closest.",
    options: [
      { label: "Big club energy", desc: "Loud, packed, dancing until close", s: {vegas:3, mexico:2} },
      { label: "Live music and good cocktails", desc: "Jazz rooms, lounges, a band worth hearing", s: {vegas:2, mexico:3} },
      { label: "Rooftops and late bites", desc: "Great views, great food, moving between spots", s: {vegas:1, mexico:3} },
      { label: "A low-key bar with the guys", desc: "Easy conversation, no velvet rope", s: {vegas:1, mexico:2} }
    ]},
  { q: "What should the daytime look like?", hint: "Think hangover recovery plus a little adventure.",
    options: [
      { label: "Something active", desc: "A hike, pyramids, getting outside", s: {vegas:2, mexico:3} },
      { label: "Culture and sights", desc: "Museums, murals, neighborhoods", s: {vegas:0, mexico:3} },
      { label: "Downtime", desc: "Sleep in, a long brunch, nowhere to be", s: {vegas:2, mexico:1} },
      { label: "Games and sports", desc: "Sportsbook, arcades, a good bet", s: {vegas:3, mexico:0} }
    ]},
  { q: "What kind of food trip do you want?", hint: "",
    options: [
      { label: "Adventurous and local", desc: "Street food, markets, things I can't get at home", s: {vegas:1, mexico:3} },
      { label: "Great restaurants", desc: "Reservations and a good steak or seafood", s: {vegas:2, mexico:2} },
      { label: "Keep it simple", desc: "Good food without the production", s: {vegas:2, mexico:0} }
    ]},
  { q: "Where do you want to sleep?", hint: "Where the crew lands at the end of the night.",
    options: [
      { label: "One big house together", desc: "Shared kitchen, late-night hangs on the couch", s: {vegas:3, mexico:2} },
      { label: "A great hotel in the middle of the action", desc: "Walk to everything", s: {vegas:2, mexico:3} },
      { label: "I don't care as long as I have a bed", desc: "", s: {vegas:1, mexico:1} }
    ]},
  { q: "What's your comfortable all-in budget?", hint: "Flights, lodging, food, and fun.",
    options: [
      { label: "Up to $1,500", desc: "", s: {vegas:2, mexico:1} },
      { label: "Up to $2,000", desc: "", s: {vegas:2, mexico:2} },
      { label: "Up to $2,500", desc: "", s: {vegas:2, mexico:2} }
    ]},
  { q: "Who should run the itinerary?", hint: "",
    options: [
      { label: "Someone who knows the city", desc: "Tell me where to go and I'll show up", s: {vegas:0, mexico:3} },
      { label: "A mix of plans and free time", desc: "", s: {vegas:1, mexico:1} },
      { label: "We'll figure it out when we land", desc: "", s: {vegas:2, mexico:0} }
    ]}
];

let step = 0;
const answers = new Array(QUESTIONS.length).fill(null);
let suggestion = null, scores = null, pct = null;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
$("eyebrow").textContent = CONFIG.eyebrow;
$("foot").textContent = "Hosted by " + CONFIG.organizer;
$("track").innerHTML = (function(){
  const unit = '<span>Las Vegas</span><b>/</b><span>Mexico City</span><b>/</b><span>Feb 18 to 22</span><b>/</b><span>Birthday weekend</span><b>/</b>';
  return unit + unit + unit + unit;
})();

function drawSeg(){
  const el = $("seg"); el.innerHTML = "";
  QUESTIONS.forEach((_, i) => { const d = document.createElement("i"); if (i <= step) d.className = "on"; el.appendChild(d); });
}

function renderQuestion(){
  const q = QUESTIONS[step];
  $("count").textContent = "Question";
  $("num").textContent = pad(step+1) + " / " + pad(QUESTIONS.length);
  drawSeg();
  const card = $("card");
  card.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = q.q; card.appendChild(h);
  const p = document.createElement("p"); p.className = "hint"; p.textContent = q.hint || " "; card.appendChild(p);
  q.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (answers[step] === i ? " sel" : "");
    b.innerHTML = '<span class="bd"></span><span class="tx"><b></b>' + (o.desc ? '<span class="d"></span>' : '') + '</span>';
    b.querySelector(".bd").textContent = String.fromCharCode(65 + i);
    b.querySelector("b").textContent = o.label;
    if (o.desc) b.querySelector(".d").textContent = o.desc;
    b.onclick = () => { answers[step] = i; renderQuestion(); };
    card.appendChild(b);
  });
  $("back").disabled = step === 0;
  $("next").disabled = answers[step] === null;
  $("next").textContent = step === QUESTIONS.length - 1 ? "See my match" : "Next";
}

$("back").onclick = () => { if (step > 0) { step--; renderQuestion(); } };
$("next").onclick = () => {
  if (answers[step] === null) return;
  if (step < QUESTIONS.length - 1) { step++; renderQuestion(); }
  else showResult();
};

function compute(){
  scores = {vegas:0, mexico:0};
  let max = 0;
  QUESTIONS.forEach((q, qi) => {
    const pick = q.options[answers[qi]];
    KEYS.forEach(k => scores[k] += pick.s[k]);
    max += Math.max(...q.options.map(o => Math.max(...KEYS.map(k => o.s[k]))));
  });
  pct = {};
  KEYS.forEach(k => pct[k] = Math.round(scores[k] / max * 100));
  const ranked = KEYS.slice().sort((a,b) => scores[b] - scores[a]);
  suggestion = ranked[0];
  return ranked;
}

let finalPick = null, status = "";

function showResult(){
  const ranked = compute();
  finalPick = suggestion;
  $("quiz").classList.add("hidden");
  $("title").textContent = "The verdict";
  $("intro").textContent = "Based on your answers. You can change it below.";
  const close = (scores[ranked[0]] - scores[ranked[1]]) <= 2;
  const t = TRIPS[suggestion];
  const root = $("result");
  root.classList.remove("hidden");
  root.innerHTML = "";

  const m = document.createElement("div"); m.className = "match";
  m.style.setProperty("--tc", t.color); m.style.setProperty("--tt", t.tint);
  m.innerHTML = '<span class="tag">Suggested for you</span><div class="mono"></div><h2></h2><div class="tagline"></div><div class="meta" id="m1"></div><p id="m2"></p><p class="meta" id="m3"></p>';
  m.querySelector(".mono").textContent = t.mono;
  m.querySelector("h2").textContent = t.name;
  m.querySelector(".tagline").textContent = t.tagline;
  m.querySelector("#m1").textContent = t.dates + " | " + t.cost;
  m.querySelector("#m2").textContent = t.pitch;
  m.querySelector("#m3").textContent = "Heads up: " + t.catch + (close ? " It was a close call with " + TRIPS[ranked[1]].name + "." : "");
  root.appendChild(m);

  const bars = document.createElement("div"); bars.className = "bars";
  ranked.forEach(k => {
    const d = document.createElement("div"); d.className = "bar";
    d.innerHTML = '<div class="row"><span></span><span></span></div><div class="tr"><div class="fill" style="width:0"></div></div>';
    const sp = d.querySelectorAll("span");
    sp[0].textContent = TRIPS[k].name; sp[1].textContent = pct[k] + "% match";
    const f = d.querySelector(".fill"); f.style.background = TRIPS[k].color;
    bars.appendChild(d);
    requestAnimationFrame(() => f.style.width = pct[k] + "%");
  });
  root.appendChild(bars);

  const form = document.createElement("div"); form.className = "card"; form.style.marginTop = "18px";
  form.innerHTML = '<h2>Your call</h2><p class="hint">Pick the trip you actually want. It does not have to match.</p><div id="trips"></div>' +
    '<label class="f">Are you in?</label><div class="chips" id="chips"></div>' +
    '<label class="f" for="nm">Your name</label><input type="text" id="nm" placeholder="First name" autocomplete="given-name">' +
    '<label class="f" for="nt">Anything I should know? (optional)</label><textarea id="nt" placeholder="Dates that don\'t work, budget limits, a must-do..."></textarea>' +
    '<div class="nav"><button class="btn" id="retake">Retake</button><button class="btn primary" id="submit" disabled>Lock it in</button></div>' +
    '<p class="note" id="deadline"></p>';
  root.appendChild(form);

  const tripsEl = form.querySelector("#trips");
  function drawTrips(){
    tripsEl.innerHTML = "";
    KEYS.forEach(k => {
      const lab = document.createElement("label"); lab.className = "trip" + (finalPick === k ? " sel" : "");
      lab.style.setProperty("--tc", TRIPS[k].color); lab.style.setProperty("--tt", TRIPS[k].tint);
      lab.innerHTML = '<div class="t"><input type="radio" name="trip"><span class="mn"></span><span class="nm"></span></div><div class="d"></div>';
      lab.querySelector("input").checked = finalPick === k;
      lab.querySelector(".mn").textContent = TRIPS[k].mono;
      lab.querySelector(".nm").textContent = TRIPS[k].name + ": " + TRIPS[k].tagline + (k === suggestion ? " (suggested)" : "");
      lab.querySelector(".d").textContent = TRIPS[k].dates + " | " + TRIPS[k].cost;
      lab.onclick = () => { finalPick = k; drawTrips(); };
      tripsEl.appendChild(lab);
    });
  }
  drawTrips();

  const chipsEl = form.querySelector("#chips");
  ["I'm in", "In if the dates work", "Maybe", "Can't make it"].forEach(s => {
    const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = s;
    c.onclick = () => { status = s; chipsEl.querySelectorAll(".chip").forEach(x => x.classList.remove("sel")); c.classList.add("sel"); check(); };
    chipsEl.appendChild(c);
  });

  const nm = form.querySelector("#nm"), sub = form.querySelector("#submit");
  function check(){ sub.disabled = !(nm.value.trim() && status); }
  nm.addEventListener("input", check);
  form.querySelector("#deadline").textContent = (CONFIG.replyBy ? "Tell me your pick by " + CONFIG.replyBy + ". " : "") + "Silence will be recorded as 'whatever " + CONFIG.organizer + " wants.'";
  form.querySelector("#retake").onclick = () => location.reload();
  sub.onclick = () => submit(nm.value.trim(), form.querySelector("#nt").value.trim());
  window.scrollTo({top:0, behavior:"smooth"});
}

function buildSummary(name, note){
  const lines = [
    "Guys trip poll: " + name,
    "My pick: " + TRIPS[finalPick].name + (finalPick === suggestion ? " (matched my quiz)" : " (quiz suggested " + TRIPS[suggestion].name + ")"),
    "Status: " + status,
    "Match: " + KEYS.map(k => TRIPS[k].name + " " + pct[k] + "%").join(", ")
  ];
  if (note) lines.push("Note: " + note);
  return lines.join("\n");
}

async function submit(name, note){
  const text = buildSummary(name, note);
  const payload = {
    name, status, note,
    pick: TRIPS[finalPick].name,
    suggested: TRIPS[suggestion].name,
    matchPercent: pct,
    answers: QUESTIONS.map((q, i) => ({ question: q.q, answer: q.options[answers[i]].label })),
    submittedAt: new Date().toISOString()
  };
  let sent = false;
  if (CONFIG.formEndpoint) {
    try {
      const r = await fetch(CONFIG.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(payload) });
      sent = r.ok;
    } catch (e) { sent = false; }
  }
  const root = $("result");
  root.innerHTML = "";
  $("title").textContent = "Locked in, " + name;
  $("intro").textContent = sent ? "Your pick was sent to " + CONFIG.organizer + "." : "One last step: send this to " + CONFIG.organizer + ".";
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = (sent ? '<p class="ok">Sent</p>' : '') + '<pre id="sum"></pre><div class="nav"><button class="btn primary" id="copy">Copy</button><button class="btn" id="share">Share</button></div><p class="note" id="msg"></p>';
  card.querySelector("#sum").textContent = text;
  root.appendChild(card);
  card.querySelector("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText(text); card.querySelector("#msg").textContent = "Copied. Paste it in the group chat or text it to " + CONFIG.organizer + "."; }
    catch (e) { card.querySelector("#msg").textContent = "Select the text above and copy it."; }
  };
  card.querySelector("#share").onclick = async () => {
    if (navigator.share) { try { await navigator.share({ text }); } catch (e) {} }
    else card.querySelector("#msg").textContent = "Sharing isn't available here. Use Copy instead.";
  };
  window.scrollTo({top:0, behavior:"smooth"});
}

renderQuestion();
</script>
</body>
</html>
