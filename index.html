<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday Trip Poll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff7e8; --paper:#ffffff; --ink:#2b1d16; --muted:#7a6558; --line:#f0dfc4;
    --marigold:#ffb627; --coral:#ff6b4a; --pink:#ee3f7f; --teal:#14a39a; --sky:#2a9df4; --grape:#7a4bd1;
    --vegas:#ee3f7f; --mexico:#14a39a;
  }
  *{box-sizing:border-box}
  html{background:var(--cream)}
  body{
    margin:0;color:var(--ink);
    font:17px/1.45 "Nunito",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #ffe3a8 0, transparent 38%),
      radial-gradient(circle at 92% 22%, #ffd0d9 0, transparent 34%),
      var(--cream);
    min-height:100vh;
  }
  .wrap{max-width:620px;margin:0 auto;padding:0 16px 70px}
  .bunting{display:block;width:calc(100% + 32px);margin:0 -16px;height:54px}
  header{text-align:center;padding:6px 6px 14px}
  .eyebrow{display:inline-block;background:var(--ink);color:#fff3d6;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:6px 14px;border-radius:99px}
  h1{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:800;font-size:34px;line-height:1.08;margin:14px 0 8px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 auto;max-width:440px;font-weight:600}

  .dots{display:flex;gap:6px;justify-content:center;margin:18px 0 6px}
  .dots i{width:26px;height:8px;border-radius:99px;background:var(--line);transition:background .2s}
  .dots i.on{background:var(--c,var(--coral))}
  .count{text-align:center;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}

  .card{background:var(--paper);border-radius:22px;padding:22px 18px 20px;border:2px solid var(--ink);box-shadow:5px 6px 0 var(--ink);position:relative}
  .card.accent{--c:var(--coral)}
  h2{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:24px;line-height:1.2;margin:0 0 4px}
  .hint{color:var(--muted);font-size:15px;font-weight:600;margin:0 0 6px}

  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fffdf8;color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:13px 14px;margin:11px 0 0;font:inherit;cursor:pointer;transition:transform .1s, border-color .12s, background .12s}
  .opt:hover{border-color:var(--c,var(--coral));transform:translateY(-1px)}
  .opt .em{font-size:26px;line-height:1;flex:0 0 auto}
  .opt .tx{flex:1}
  .opt b{display:block;font-weight:800}
  .opt .d{display:block;color:var(--muted);font-size:14.5px;font-weight:600;margin-top:1px}
  .opt.sel{border-color:var(--ink);background:var(--tint,#fff0cf);box-shadow:3px 3px 0 var(--ink)}

  .nav{display:flex;gap:12px;margin-top:18px}
  button.btn{flex:1;border:2px solid var(--ink);border-radius:16px;padding:14px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;color:var(--ink);background:#fff;box-shadow:3px 4px 0 var(--ink);transition:transform .08s, box-shadow .08s}
  button.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
  .primary{background:var(--marigold)}
  button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

  .match{border:2px solid var(--ink);border-radius:22px;padding:20px 18px;background:linear-gradient(160deg,var(--mt,#ffd7e5),#fff3d6);box-shadow:5px 6px 0 var(--ink);position:relative;overflow:hidden}
  .tag{display:inline-block;background:var(--ink);color:#fff3d6;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;padding:5px 12px;border-radius:99px}
  .match .big{font-size:44px;line-height:1;margin:12px 0 2px}
  .match h2{font-size:28px;margin:4px 0}
  .meta{color:#5a463a;font-size:15px;margin:6px 0 0;font-weight:700}
  .match p{margin:10px 0 0;font-weight:600}
  .match p.meta{font-weight:700}

  .bars{margin:20px 2px 4px}
  .bar{margin:12px 0}
  .bar .row{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:5px}
  .bar .track{height:14px;background:#f3e6cf;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
  .bar .fill{height:100%;border-radius:99px;transition:width .5s ease}

  .trip{display:block;border:2px solid var(--line);border-radius:16px;padding:13px 14px;margin:11px 0;cursor:pointer;background:#fffdf8;transition:transform .1s}
  .trip:hover{transform:translateY(-1px)}
  .trip.sel{border-color:var(--ink);background:var(--tint);box-shadow:3px 3px 0 var(--ink)}
  .trip .t{font-weight:800;display:flex;gap:10px;align-items:center}
  .trip .t .em{font-size:24px}
  .trip input{accent-color:var(--ink);width:18px;height:18px;flex:0 0 auto}
  .trip .d{color:var(--muted);font-size:14px;font-weight:600;margin:4px 0 0 0}

  label.f{display:block;font-weight:800;margin:20px 0 8px}
  input[type=text],textarea{width:100%;background:#fffdf8;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-weight:600}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ink)}
  textarea{min-height:84px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:2px solid var(--line);border-radius:99px;padding:9px 15px;cursor:pointer;font:inherit;font-size:15.5px;font-weight:800;background:#fffdf8;color:var(--ink)}
  .chip.sel{border-color:var(--ink);background:var(--marigold);box-shadow:2px 3px 0 var(--ink)}
  .note{color:var(--muted);font-size:14px;font-weight:600;margin:14px 0 0;text-align:center}
  pre{white-space:pre-wrap;background:#fffaf0;border:2px dashed var(--ink);border-radius:14px;padding:14px;font:600 14.5px/1.5 "Nunito",sans-serif;margin:12px 0}
  .ok{color:var(--teal);font-weight:800;margin:0}
  .hidden{display:none}
  .foot{text-align:center;color:var(--muted);font-weight:700;font-size:14px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <svg class="bunting" viewBox="0 0 400 54" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 6 Q100 22 200 6 T400 6" fill="none" stroke="#2b1d16" stroke-width="2"/>
    <g>
      <polygon points="10,9 42,13 24,46" fill="#ff6b4a"/>
      <polygon points="58,14 90,15 72,48" fill="#ffb627"/>
      <polygon points="106,15 138,14 122,47" fill="#14a39a"/>
      <polygon points="154,14 186,11 170,44" fill="#ee3f7f"/>
      <polygon points="214,11 246,14 230,46" fill="#2a9df4"/>
      <polygon points="262,14 294,15 278,48" fill="#ff6b4a"/>
      <polygon points="310,15 342,14 326,47" fill="#ffb627"/>
      <polygon points="358,14 390,10 374,44" fill="#7a4bd1"/>
    </g>
  </svg>

  <header>
    <div class="eyebrow" id="eyebrow">Feb 2027 guys trip</div>
    <h1 id="title">Where are we celebrating?</h1>
    <p class="sub" id="intro">Nine quick questions. I'll suggest the trip that fits you best, then you make the final call.</p>
  </header>

  <div id="quiz">
    <div class="dots" id="dots"></div>
    <div class="count" id="count"></div>
    <div class="card accent" id="card"></div>
    <div class="nav">
      <button class="btn" id="back">Back</button>
      <button class="btn primary" id="next" disabled>Next</button>
    </div>
  </div>

  <div id="result" class="hidden"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ============ EDIT THESE ============ */
const CONFIG = {
  organizer: "Andrew",
  replyBy: "",              // e.g. "Nov 20"  (shown to guys; leave blank to hide)
  formEndpoint: "",         // optional: a Formspree URL like https://formspree.io/f/xxxxxxx
  eyebrow: "Feb 2027 guys trip"
};
/* ==================================== */

const TRIPS = {
  vegas: {
    emoji: "🎰", color: "#ee3f7f", tint: "#ffe0ec",
    name: "Las Vegas",
    tagline: "The Birthday Weekend",
    dates: "Fri Feb 19 to Mon Feb 22 (birthday is Fri Feb 19)",
    cost: "Roughly $1,300 to $2,200 per person",
    pitch: "Party and hangout, on the actual day. A big residency night out, a morning hike at Red Rock, a big house with a big kitchen for a cook-in, and a steakhouse dinner. Nonstop flights from Ohio.",
    catch: "Cool in February (60s) and lighter on culture than Mexico City."
  },
  mexico: {
    emoji: "🌮", color: "#14a39a", tint: "#d8f4ef",
    name: "Mexico City",
    tagline: "The Mexican Experience",
    dates: "Thu Feb 18 to Mon Feb 22",
    cost: "Roughly $1,500 to $2,200 per person",
    pitch: "Culture, food and nightlife with a guide who lived there for a year. Tacos al pastor where locals eat, mezcal bars, museums and murals, pyramids for the active day, and a long birthday dinner. Mild days, cool nights.",
    catch: "Passport needed, no nonstop from Cincinnati, and no confirmed headline R&B show."
  }
};
const KEYS = ["vegas","mexico"];
const DOT_COLORS = ["#ff6b4a","#ffb627","#14a39a","#ee3f7f","#2a9df4","#7a4bd1","#ff8a1f","#14a39a","#ee3f7f"];

const QUESTIONS = [
  { q: "What kind of weekend do you want?", hint: "Pick the one that sounds best.",
    options: [
      { em:"🎉", label: "Party and hangout", desc: "Shows, nightlife, staying up late", s: {vegas:3, mexico:2} },
      { em:"🌮", label: "Explore and eat", desc: "Neighborhoods, culture, long meals", s: {vegas:0, mexico:3} },
      { em:"🛋️", label: "Relax and recharge", desc: "Easy pace, good company, no rushing", s: {vegas:2, mexico:1} },
      { em:"✨", label: "A little of everything", desc: "", s: {vegas:1, mexico:1} }
    ]},
  { q: "How much does warm weather matter?", hint: "February highs: Vegas 60s, Mexico City 70s.",
    options: [
      { em:"☀️", label: "I want to be warm", desc: "Shorts and sunscreen", s: {vegas:0, mexico:3} },
      { em:"🧥", label: "Mild is fine", desc: "Light jacket at night is no problem", s: {vegas:2, mexico:2} },
      { em:"🤷🏾‍♂️", label: "I don't care", desc: "", s: {vegas:1, mexico:1} }
    ]},
  { q: "What should the birthday night be?", hint: "Friday, Feb 19.",
    options: [
      { em:"🎤", label: "A big show", desc: "Headliner, then out after", s: {vegas:3, mexico:0} },
      { em:"🍽️", label: "An unforgettable dinner", desc: "Long table, great food, great stories", s: {vegas:2, mexico:3} },
      { em:"🪩", label: "Out with the whole crew", desc: "Clubs, lounges, keep moving", s: {vegas:2, mexico:3} },
      { em:"🎶", label: "Low key", desc: "Cook-in, music, good company", s: {vegas:2, mexico:1} }
    ]},
  { q: "What does your ideal night out look like?", hint: "Pick the closest.",
    options: [
      { em:"🪩", label: "Big club energy", desc: "Loud, packed, dancing until close", s: {vegas:3, mexico:2} },
      { em:"🍸", label: "Live music and good cocktails", desc: "Jazz rooms, lounges, a band worth hearing", s: {vegas:2, mexico:3} },
      { em:"🌃", label: "Rooftops and late bites", desc: "Great views, great food, moving between spots", s: {vegas:1, mexico:3} },
      { em:"🍻", label: "A low-key bar with the guys", desc: "Easy conversation, no velvet rope", s: {vegas:1, mexico:2} }
    ]},
  { q: "What should the daytime look like?", hint: "Think hangover recovery plus a little adventure.",
    options: [
      { em:"🥾", label: "Something active", desc: "A hike, pyramids, getting outside", s: {vegas:2, mexico:3} },
      { em:"🏛️", label: "Culture and sights", desc: "Museums, murals, neighborhoods", s: {vegas:0, mexico:3} },
      { em:"🥞", label: "Downtime", desc: "Sleep in, a long brunch, nowhere to be", s: {vegas:2, mexico:1} },
      { em:"🏈", label: "Games and sports", desc: "Sportsbook, arcades, a good bet", s: {vegas:3, mexico:0} }
    ]},
  { q: "What kind of food trip do you want?", hint: "",
    options: [
      { em:"🌶️", label: "Adventurous and local", desc: "Street food, markets, things I can't get at home", s: {vegas:1, mexico:3} },
      { em:"🥩", label: "Great restaurants", desc: "Reservations and a good steak or seafood", s: {vegas:2, mexico:2} },
      { em:"🍔", label: "Keep it simple", desc: "Good food without the production", s: {vegas:2, mexico:0} }
    ]},
  { q: "Where do you want to sleep?", hint: "Where the crew lands at the end of the night.",
    options: [
      { em:"🏡", label: "One big house together", desc: "Shared kitchen, late-night hangs on the couch", s: {vegas:3, mexico:2} },
      { em:"🏨", label: "A great hotel in the middle of the action", desc: "Walk to everything", s: {vegas:2, mexico:3} },
      { em:"🛏️", label: "I don't care as long as I have a bed", desc: "", s: {vegas:1, mexico:1} }
    ]},
  { q: "What's your comfortable all-in budget?", hint: "Flights, lodging, food, and fun.",
    options: [
      { em:"💵", label: "Up to $1,500", desc: "", s: {vegas:2, mexico:1} },
      { em:"💰", label: "Up to $2,000", desc: "", s: {vegas:2, mexico:2} },
      { em:"🤑", label: "Up to $2,500", desc: "", s: {vegas:2, mexico:2} }
    ]},
  { q: "Who should run the itinerary?", hint: "",
    options: [
      { em:"🧭", label: "Someone who knows the city", desc: "Tell me where to go and I'll show up", s: {vegas:0, mexico:3} },
      { em:"🗓️", label: "A mix of plans and free time", desc: "", s: {vegas:1, mexico:1} },
      { em:"🎲", label: "We'll figure it out when we land", desc: "", s: {vegas:2, mexico:0} }
    ]}
];

let step = 0;
const answers = new Array(QUESTIONS.length).fill(null);
let suggestion = null, scores = null, pct = null;

const $ = id => document.getElementById(id);
$("eyebrow").textContent = CONFIG.eyebrow;
$("foot").textContent = "Hosted by " + CONFIG.organizer + " 🎂";

function drawDots(){
  const el = $("dots"); el.innerHTML = "";
  QUESTIONS.forEach((_, i) => {
    const d = document.createElement("i");
    if (i <= step) { d.className = "on"; d.style.setProperty("--c", DOT_COLORS[i % DOT_COLORS.length]); }
    el.appendChild(d);
  });
}

function renderQuestion(){
  const q = QUESTIONS[step];
  const c = DOT_COLORS[step % DOT_COLORS.length];
  $("count").textContent = "Question " + (step+1) + " of " + QUESTIONS.length;
  drawDots();
  const card = $("card");
  card.style.setProperty("--c", c);
  card.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = q.q; card.appendChild(h);
  const p = document.createElement("p"); p.className = "hint"; p.textContent = q.hint || " "; card.appendChild(p);
  q.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (answers[step] === i ? " sel" : "");
    b.innerHTML = '<span class="em"></span><span class="tx"><b></b>' + (o.desc ? '<span class="d"></span>' : '') + '</span>';
    b.querySelector(".em").textContent = o.em;
    b.querySelector("b").textContent = o.label;
    if (o.desc) b.querySelector(".d").textContent = o.desc;
    b.onclick = () => { answers[step] = i; renderQuestion(); };
    card.appendChild(b);
  });
  $("back").disabled = step === 0;
  $("next").disabled = answers[step] === null;
  $("next").textContent = step === QUESTIONS.length - 1 ? "See my match 🎉" : "Next";
}

$("back").onclick = () => { if (step > 0) { step--; renderQuestion(); } };
$("next").onclick = () => {
  if (answers[step] === null) return;
  if (step < QUESTIONS.length - 1) { step++; renderQuestion(); }
  else showResult();
};

function compute(){
  scores = {vegas:0, mexico:0};
  let max = 0;
  QUESTIONS.forEach((q, qi) => {
    const pick = q.options[answers[qi]];
    KEYS.forEach(k => scores[k] += pick.s[k]);
    max += Math.max(...q.options.map(o => Math.max(...KEYS.map(k => o.s[k]))));
  });
  pct = {};
  KEYS.forEach(k => pct[k] = Math.round(scores[k] / max * 100));
  const ranked = KEYS.slice().sort((a,b) => scores[b] - scores[a]);
  suggestion = ranked[0];
  return ranked;
}

let finalPick = null, status = "";

function showResult(){
  const ranked = compute();
  finalPick = suggestion;
  $("quiz").classList.add("hidden");
  $("title").textContent = "Here's your match!";
  $("intro").textContent = "Based on your answers. You can change it below.";
  const close = (scores[ranked[0]] - scores[ranked[1]]) <= 2;
  const t = TRIPS[suggestion];
  const root = $("result");
  root.classList.remove("hidden");
  root.innerHTML = "";

  const m = document.createElement("div"); m.className = "match";
  m.style.setProperty("--mt", t.tint);
  m.innerHTML = '<span class="tag">Suggested for you</span><div class="big"></div><h2></h2><div class="meta" id="m1"></div><p id="m2"></p><p class="meta" id="m3"></p>';
  m.querySelector(".big").textContent = t.emoji;
  m.querySelector("h2").textContent = t.name + ": " + t.tagline;
  m.querySelector("#m1").textContent = t.dates + " | " + t.cost;
  m.querySelector("#m2").textContent = t.pitch;
  m.querySelector("#m3").textContent = "Heads up: " + t.catch + (close ? " It was a close call with " + TRIPS[ranked[1]].name + "." : "");
  root.appendChild(m);

  const bars = document.createElement("div"); bars.className = "bars";
  ranked.forEach(k => {
    const d = document.createElement("div"); d.className = "bar";
    d.innerHTML = '<div class="row"><span></span><span></span></div><div class="track"><div class="fill" style="width:0"></div></div>';
    const sp = d.querySelectorAll("span");
    sp[0].textContent = TRIPS[k].emoji + " " + TRIPS[k].name; sp[1].textContent = pct[k] + "% match";
    const f = d.querySelector(".fill"); f.style.background = TRIPS[k].color;
    bars.appendChild(d);
    requestAnimationFrame(() => f.style.width = pct[k] + "%");
  });
  root.appendChild(bars);

  const form = document.createElement("div"); form.className = "card"; form.style.marginTop = "18px";
  form.innerHTML = '<h2>Your call</h2><p class="hint">Pick the trip you actually want. It does not have to match.</p><div id="trips"></div>' +
    '<label class="f">Are you in?</label><div class="chips" id="chips"></div>' +
    '<label class="f" for="nm">Your name</label><input type="text" id="nm" placeholder="First name" autocomplete="given-name">' +
    '<label class="f" for="nt">Anything I should know? (optional)</label><textarea id="nt" placeholder="Dates that don\'t work, budget limits, a must-do..."></textarea>' +
    '<div class="nav"><button class="btn" id="retake">Retake</button><button class="btn primary" id="submit" disabled>Send my pick</button></div>' +
    '<p class="note" id="deadline"></p>';
  root.appendChild(form);

  const tripsEl = form.querySelector("#trips");
  function drawTrips(){
    tripsEl.innerHTML = "";
    KEYS.forEach(k => {
      const lab = document.createElement("label"); lab.className = "trip" + (finalPick === k ? " sel" : "");
      lab.style.setProperty("--tint", TRIPS[k].tint);
      lab.innerHTML = '<div class="t"><input type="radio" name="trip"><span class="em"></span><span class="nm"></span></div><div class="d"></div>';
      lab.querySelector("input").checked = finalPick === k;
      lab.querySelector(".em").textContent = TRIPS[k].emoji;
      lab.querySelector(".nm").textContent = TRIPS[k].name + ": " + TRIPS[k].tagline + (k === suggestion ? " (suggested)" : "");
      lab.querySelector(".d").textContent = TRIPS[k].dates + " | " + TRIPS[k].cost;
      lab.onclick = () => { finalPick = k; drawTrips(); };
      tripsEl.appendChild(lab);
    });
  }
  drawTrips();

  const chipsEl = form.querySelector("#chips");
  ["I'm in", "In if the dates work", "Maybe", "Can't make it"].forEach(s => {
    const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = s;
    c.onclick = () => { status = s; chipsEl.querySelectorAll(".chip").forEach(x => x.classList.remove("sel")); c.classList.add("sel"); check(); };
    chipsEl.appendChild(c);
  });

  const nm = form.querySelector("#nm"), sub = form.querySelector("#submit");
  function check(){ sub.disabled = !(nm.value.trim() && status); }
  nm.addEventListener("input", check);
  form.querySelector("#deadline").textContent = CONFIG.replyBy ? "Please reply by " + CONFIG.replyBy + " so " + CONFIG.organizer + " can lock in lodging." : "";
  form.querySelector("#retake").onclick = () => location.reload();
  sub.onclick = () => submit(nm.value.trim(), form.querySelector("#nt").value.trim());
  window.scrollTo({top:0, behavior:"smooth"});
}

function buildSummary(name, note){
  const lines = [
    "Guys trip poll: " + name,
    "My pick: " + TRIPS[finalPick].name + (finalPick === suggestion ? " (matched my quiz)" : " (quiz suggested " + TRIPS[suggestion].name + ")"),
    "Status: " + status,
    "Match: " + KEYS.map(k => TRIPS[k].name + " " + pct[k] + "%").join(", ")
  ];
  if (note) lines.push("Note: " + note);
  return lines.join("\n");
}

async function submit(name, note){
  const text = buildSummary(name, note);
  const payload = {
    name, status, note,
    pick: TRIPS[finalPick].name,
    suggested: TRIPS[suggestion].name,
    matchPercent: pct,
    answers: QUESTIONS.map((q, i) => ({ question: q.q, answer: q.options[answers[i]].label })),
    submittedAt: new Date().toISOString()
  };
  let sent = false;
  if (CONFIG.formEndpoint) {
    try {
      const r = await fetch(CONFIG.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(payload) });
      sent = r.ok;
    } catch (e) { sent = false; }
  }
  const root = $("result");
  root.innerHTML = "";
  $("title").textContent = "Got it, " + name + "! 🎉";
  $("intro").textContent = sent ? "Your pick was sent to " + CONFIG.organizer + "." : "One last step: send this to " + CONFIG.organizer + ".";
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = (sent ? '<p class="ok">Sent.</p>' : '') + '<pre id="sum"></pre><div class="nav"><button class="btn primary" id="copy">Copy</button><button class="btn" id="share">Share</button></div><p class="note" id="msg"></p>';
  card.querySelector("#sum").textContent = text;
  root.appendChild(card);
  card.querySelector("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText(text); card.querySelector("#msg").textContent = "Copied. Paste it in the group chat or text it to " + CONFIG.organizer + "."; }
    catch (e) { card.querySelector("#msg").textContent = "Select the text above and copy it."; }
  };
  card.querySelector("#share").onclick = async () => {
    if (navigator.share) { try { await navigator.share({ text }); } catch (e) {} }
    else card.querySelector("#msg").textContent = "Sharing isn't available here. Use Copy instead.";
  };
  window.scrollTo({top:0, behavior:"smooth"});
}

renderQuestion();
</script>
</body>
</html>
